<div #scroll class="scroll-area">
  @for (message of messages(); track message.id) {
    <app-message-bubble [message]="message" [class.user-msg]="message.role === 'user'" />
  }

  @if (latestToolEvent() || isTyping()) {
    <app-message-bubble
      [message]="{
        id: -1,
        conversation_id: 0,
        role: 'assistant',
        content: ''
      }"
      [pendingToolEvent]="latestToolEvent()"
      [isLoading]="isTyping()"
    />
  }

</div>
