<form class="chat-input" (ngSubmit)="onSubmit()">
  <input
    #fileInput
    type="file"
    class="file-input"
    accept="image/jpeg,image/png,application/pdf"
    (change)="onFileSelected($event)"
  />

  <button type="button" class="icon-btn" aria-label="Attach file" (click)="openFilePicker()">
    <svg viewBox="0 0 24 24" width="18" height="18"><use href="#icon-paperclip"/></svg>
  </button>

  @if (attachedFile()) {
    <div class="file-chip">
      <span class="file-name">{{ attachedFile()!.name }}</span>
      <button type="button" class="file-remove" aria-label="Remove file" (click)="removeFile()">×</button>
    </div>
  }

  <input
    type="text"
    name="message"
    class="text-field"
    placeholder="Type your message here..."
    [(ngModel)]="draft"
    aria-label="Type your message here..."
  />

  <button type="submit" class="send-btn" aria-label="Send message" [disabled]="disabled()">
    <svg viewBox="0 0 24 24" width="18" height="18"><use href="#icon-send"/></svg>
  </button>
</form>
