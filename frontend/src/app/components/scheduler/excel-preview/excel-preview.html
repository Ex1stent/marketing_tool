@if (posts().length) {
  <section class="section">
    <h3 class="section-title">Excel Preview</h3>
    <div class="excel-preview">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Type</th>
              <th>Platform</th>
              <th>Message</th>
              <th>Scheduled</th>
            </tr>
          </thead>
          <tbody>
            @for (post of posts(); track post.id; let i = $index) {
              <tr>
                <td>{{ i + 1 }}</td>
                <td>{{ post.post_type }}</td>
                <td>{{ post.platform ?? '-' }}</td>
                <td class="msg">{{ post.message ?? '-' }}</td>
                <td>{{ post.scheduled_time | date:'MMM d, y, HH:mm':'+0000' }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </section>
}
