<div class="excel-upload">
  <label class="upload-btn" [class.disabled]="uploading()">
    @if (uploading()) {
      <span class="spinner"></span> Uploading...
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24"><use href="#icon-upload"/></svg>
      Upload Excel
    }
    <input type="file" accept=".xlsx" (change)="onFileSelected($event)" hidden [disabled]="uploading()" />
  </label>
  @if (fileName()) {
    <span class="file-name">{{ fileName() }}</span>
  }
</div>

@if (showModal()) {
  <div class="modal-overlay" (click)="cancelUpload()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <h3>Enter Batch Name</h3>
      <input
        type="text"
        [(ngModel)]="batchTitle"
        placeholder="Enter batch title..."
        class="modal-input"
      />
      <div class="modal-actions">
        <button class="btn-cancel" (click)="cancelUpload()">Cancel</button>
        <button class="btn-upload" (click)="confirmUpload()">Upload</button>
      </div>
    </div>
  </div>
}
